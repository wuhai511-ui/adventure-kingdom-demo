<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>冒险王国 · 家长设置</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

:root {
  --cream:#FBF7F0; --parchment:#F2E8D5; --ink:#2C1810; --ink-soft:#5C3D2E;
  --gold:#D4A843; --gold-glow:#F0D68A; --gold-bright:#FFE08A;
  --forest:#3D5A35; --forest-light:#5A7D4F; --moss:#8BA87E;
  --sky-top:#C4DEF0; --sky-bot:#E8F2F8; --cloud:#F8F4EC;
  --ember:#E07B6E; --lavender:#9B8EC4;
  --shadow-soft:0 4px 20px rgba(44,24,16,.08);
  --shadow-card:0 12px 40px rgba(44,24,16,.12),0 2px 8px rgba(44,24,16,.06);
  --radius:28px; --radius-sm:16px;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(175deg,var(--sky-top) 0%,var(--sky-bot) 40%,#F0EDE4 100%);
  min-height:100vh;min-height:100dvh;
  overflow-x:hidden;
  position:relative;
}

/* ---- 背景场景 ---- */
.scene{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}

.hill{position:absolute;border-radius:50%;opacity:.65}
.hill-1{width:140%;height:280px;background:linear-gradient(180deg,#C5DBC0,#A8C9A0);bottom:-60px;left:-20%}
.hill-2{width:120%;height:220px;background:linear-gradient(180deg,#B8D4B0,#9DC098);bottom:-30px;left:-10%}
.hill-3{width:160%;height:180px;background:linear-gradient(180deg,#A0C898,#8BB882);bottom:-10px;left:-30%}

.cloud{position:absolute;background:var(--cloud);border-radius:100px;opacity:.7}
.cloud::before,.cloud::after{content:'';position:absolute;background:var(--cloud);border-radius:50%}
.cloud-1{width:120px;height:40px;top:15%;animation:drift 28s linear infinite}
.cloud-1::before{width:50px;height:50px;top:-20px;left:20px}
.cloud-1::after{width:60px;height:45px;top:-12px;left:55px}
.cloud-2{width:90px;height:30px;top:25%;right:20%;animation:drift 22s linear infinite;animation-delay:-12s}
.cloud-2::before{width:40px;height:35px;top:-15px;left:15px}
.cloud-2::after{width:45px;height:35px;top:-8px;left:45px}

@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 160px))}}

.castle-bg{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);font-size:160px;opacity:.08;filter:blur(2px);pointer-events:none}

/* ---- 主内容 ---- */
main{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px}

/* 绘本卡片 */
.card{
  background:linear-gradient(175deg,var(--cream) 0%,var(--parchment) 100%);
  border-radius:32px;
  padding:40px 32px 36px;
  max-width:410px;width:100%;
  box-shadow:var(--shadow-card),inset 0 1px 0 rgba(255,255,255,.8);
  border:2px solid rgba(212,168,67,.15);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:32px;right:32px;
  height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  border-radius:0 0 2px 2px;
}
.card::after{
  content:'✦';position:absolute;bottom:16px;right:20px;
  font-size:18px;color:var(--gold);opacity:.3;
}

.icon-area{text-align:center;margin-bottom:8px;position:relative}
.icon-castle{font-size:52px;display:inline-block;animation:castleFloat 3s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(180,130,40,.3))}
@keyframes castleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

h1{font-size:32px;font-weight:400;color:var(--ink);text-align:center;margin-bottom:4px;letter-spacing:2px}
.subtitle{text-align:center;font-size:14px;color:var(--ink-soft);margin-bottom:24px;opacity:.7}

/* 步骤指示器 */
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:24px}
.steps .dot{width:8px;height:8px;border-radius:50%;background:#D5C8B0;transition:all .3s}
.steps .dot.active{width:24px;border-radius:4px;background:var(--gold)}

/* 家长称呼选择 */
.role-row{display:flex;gap:14px;margin-bottom:20px}
.role-row .role{flex:1;padding:20px 12px;border:3px solid #E5D8C0;border-radius:var(--radius-sm);background:rgba(255,255,255,.5);font-size:36px;text-align:center;cursor:pointer;transition:all .25s}
.role-row .role.sel{border-color:var(--gold);background:linear-gradient(160deg,#FFF8E8,#FFF3C4);transform:scale(1.04);box-shadow:0 4px 16px rgba(212,168,67,.2)}
.role-row .role span{display:block;font-size:13px;font-weight:400;margin-top:6px;color:var(--ink-soft)}

/* 表单 */
.field{margin-bottom:18px}
.field label{display:block;font-size:14px;font-weight:400;color:var(--ink-soft);margin-bottom:8px;letter-spacing:1px}
.field input{
  width:100%;padding:16px 18px;
  border:2px solid #E5D8C0;border-radius:var(--radius-sm);
  font-size:17px;font-family:inherit;
  background:rgba(255,255,255,.7);
  color:var(--ink);
  transition:all .25s;
  outline:none;
  text-align:center;
}
.field input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(212,168,67,.12);
  background:#fff;
}

/* 年龄滑块 */
.slider-wrap{margin-bottom:20px}
.slider-wrap label{display:block;font-size:14px;font-weight:400;color:var(--ink-soft);margin-bottom:8px;letter-spacing:1px}
.slider-row{display:flex;align-items:center;gap:14px}
.slider-row input[type=range]{flex:1;appearance:none;height:8px;background:#E5D8C0;border-radius:4px;outline:none}
.slider-row input[type=range]::-webkit-slider-thumb{appearance:none;width:28px;height:28px;border-radius:50%;background:var(--gold);cursor:pointer;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.slider-row .age-val{width:40px;text-align:center;font-size:20px;font-weight:400;color:var(--gold)}

/* 头像选择 */
.avatar-pick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.avatar-pick .opt{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;border:3px solid #E5D8C0;transition:all .2s}
.avatar-pick .opt.sel{border-color:var(--gold);background:linear-gradient(160deg,#FFF8E8,#FFF3C4);transform:scale(1.1);box-shadow:0 4px 12px rgba(212,168,67,.2)}

/* 按钮 */
.btn{
  display:block;width:100%;padding:18px;
  border:none;border-radius:var(--radius-sm);
  font-size:19px;font-family:inherit;font-weight:400;
  letter-spacing:2px;
  cursor:pointer;
  transition:all .2s;
}
.btn-primary{
  background:linear-gradient(160deg,var(--gold),#C99A38);
  color:#FFFEF9;
  box-shadow:0 6px 0 #A87B22,0 8px 24px rgba(180,130,40,.25);
  position:relative;
  overflow:hidden;
}
.btn-primary::after{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%);
  animation:btnShine 3s ease-in-out infinite;
}
@keyframes btnShine{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.btn-primary:active{transform:translateY(3px);box-shadow:0 3px 0 #A87B22,0 4px 12px rgba(180,130,40,.2)}
.btn-primary:disabled{background:#ccc;box-shadow:none;cursor:not-allowed}

/* Toast */
.toast{
  position:fixed;top:30px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--cream);
  padding:14px 28px;border-radius:20px;font-size:15px;
  z-index:999;display:none;
  box-shadow:0 8px 24px rgba(44,24,16,.2);
  letter-spacing:1px;
}

#loading{display:none;text-align:center;padding:10px 0}
#loading .spinner{font-size:32px;animation:castleFloat 2s ease-in-out infinite}

@media(max-width:400px){
  .card{padding:32px 24px 28px}
  h1{font-size:28px}
}
</style>
</head>
<body>

<div class="scene">
  <div class="hill hill-1"></div>
  <div class="hill hill-2"></div>
  <div class="hill hill-3"></div>
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="castle-bg">🏰</div>
</div>

<main>
  <div class="card">

    <!-- 步骤1：选择家长称呼 -->
    <div id="step1">
      <div class="icon-area">
        <span class="icon-castle">🤴</span>
      </div>
      <h1>欢迎，国王大人！</h1>
      <p class="subtitle">先选一个威武的国王称号吧</p>

      <div class="steps">
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>

      <div class="role-row">
        <div class="role sel" data-role="国王爸爸" onclick="pickParentRole(this)">
          <div>🤴</div>
          <span>国王爸爸</span>
        </div>
        <div class="role" data-role="国王妈妈" onclick="pickParentRole(this)">
          <div>👸</div>
          <span>国王妈妈</span>
        </div>
      </div>

      <button class="btn btn-primary" onclick="goStep2()">下一步 →</button>
    </div>

    <!-- 步骤2：添加第一个孩子 -->
    <div id="step2" style="display:none">
      <div class="icon-area">
        <span class="icon-castle">🧒</span>
      </div>
      <h1>添加小勇士</h1>
      <p class="subtitle">介绍一下你的第一位小探险家</p>

      <div class="steps">
        <div class="dot"></div>
        <div class="dot active"></div>
      </div>

      <div class="field">
        <label>🧒 宝贝叫什么名字？</label>
        <input id="childName" type="text" placeholder="输入宝贝名字" value="小勇士" autocomplete="off">
      </div>

      <div class="slider-wrap">
        <label>🎂 宝贝多大啦？ <span id="ageText" style="color:var(--gold);font-weight:400">6 岁</span></label>
        <div class="slider-row">
          <span style="font-size:14px;color:var(--ink-soft)">1</span>
          <input type="range" id="childAge" min="1" max="12" value="6" oninput="updateAge(this.value)">
          <span style="font-size:14px;color:var(--ink-soft)">12</span>
        </div>
      </div>

      <div class="field">
        <label>🐾 帮宝贝选个头像吧</label>
      </div>
      <div class="avatar-pick" id="avatarPick">
        <div class="opt sel" data-a="🦊" onclick="pickAvatar(this)">🦊</div>
        <div class="opt" data-a="🐯" onclick="pickAvatar(this)">🐯</div>
        <div class="opt" data-a="🐰" onclick="pickAvatar(this)">🐰</div>
        <div class="opt" data-a="🐱" onclick="pickAvatar(this)">🐱</div>
        <div class="opt" data-a="🐶" onclick="pickAvatar(this)">🐶</div>
        <div class="opt" data-a="🐼" onclick="pickAvatar(this)">🐼</div>
        <div class="opt" data-a="🐨" onclick="pickAvatar(this)">🐨</div>
        <div class="opt" data-a="🐸" onclick="pickAvatar(this)">🐸</div>
      </div>

      <button class="btn btn-primary" id="submitBtn" onclick="submitSetup()">开启冒险王国！ 🎉</button>
    </div>

    <div id="loading">
      <div class="spinner">🗺️</div>
      <p style="color:var(--ink-soft);margin-top:12px">正在搭建王国...</p>
    </div>

  </div>
</main>

<div class="toast" id="toast"></div>

<script>
var AUTH_TOKEN = localStorage.getItem('token') || '';
var API_BASE = '/adventure-kingdom';
var parentRole = '国王爸爸';
var childAvatar = '🦊';

// Auth check
(function(){
  if(!AUTH_TOKEN){ window.location.href = API_BASE + '/'; }
})();

function pickParentRole(el){
  document.querySelectorAll('#step1 .role').forEach(function(r){ r.classList.remove('sel'); });
  el.classList.add('sel');
  parentRole = el.dataset.role;
}

function goStep2(){
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
}

function pickAvatar(el){
  document.querySelectorAll('#avatarPick .opt').forEach(function(o){ o.classList.remove('sel'); });
  el.classList.add('sel');
  childAvatar = el.dataset.a;
}

function updateAge(v){
  document.getElementById('ageText').textContent = v + ' 岁';
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 2500);
}

function disableForm(){
  document.getElementById('step2').style.opacity = '.5';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('loading').style.display = 'block';
}

async function submitSetup(){
  var childName = document.getElementById('childName').value.trim() || '小勇士';
  var childAge = parseInt(document.getElementById('childAge').value) || 6;

  disableForm();

  try {
    // Step 1: Create child (更新名字)
    var cRes = await fetch(API_BASE + '/api/children', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AUTH_TOKEN },
      body: JSON.stringify({ name: childName, avatar: childAvatar, age: childAge })
    });
    var cJson = await cRes.json();
    if (cJson.code !== 0) {
      showToast(cJson.msg || '创建孩子失败');
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('step2').style.opacity = '1';
      return;
    }

    // Step 2: Mark onboarding done with parent info
    var oRes = await fetch(API_BASE + '/api/auth/onboard-done', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AUTH_TOKEN },
      body: JSON.stringify({ parentName: parentRole })
    });
    var oJson = await oRes.json();

    // Update stored user info
    var user = JSON.parse(localStorage.getItem('user') || '{}');
    user.role = 'parent';
    user.onboardingDone = true;
    user.childName = childName;
    user.parentName = parentRole;
    localStorage.setItem('user', JSON.stringify(user));

    window.location.href = API_BASE + '/app.html?mode=parent';
  } catch(e) {
    showToast('网络错误，请稍后重试');
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('step2').style.opacity = '1';
  }
}
</script>
</body>
</html>
